<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.json">
  <title>Zeitungs-Navi</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

  <style>
     * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: #555 transparent; }
     ::-webkit-scrollbar { width: 6px; height: 6px; }
     ::-webkit-scrollbar-track { background: transparent; }
     ::-webkit-scrollbar-thumb { background: #555; border-radius: 10px; }
     ::-webkit-scrollbar-thumb:hover { background: #888; }

     body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #121212; color: white; margin: 0; padding: 0; position: fixed; inset: 0; display: flex; flex-direction: column; overflow-x: hidden; }
     button { cursor: pointer; font-family: inherit; }
     input { font-size: 16px; padding: 12px; border-radius: 8px; border: none; width: 100%; font-family: inherit; }
     
     .view { display: none; flex-direction: column; height: 100%; width: 100%; position: relative; overflow-x: hidden; }
     .active-view { display: flex; }
     
     .leaflet-container { background: #121212 !important; }

     #view-start { padding: 20px; overflow-y: auto; background: #1a1a1a; }
     .start-container { width: 100%; max-width: 1400px; display: flex; flex-direction: column; gap: 20px; margin: 0 auto; }
     .start-title { font-size: 32px; font-weight: bold; margin-bottom: 10px; margin-top: 10px; color: #00E676; text-align: center; }
     .route-list-container { display: flex; flex-direction: column; gap: 15px; width: 100%; }
     .route-btn { background: #222; color: white; border: 2px solid #333; padding: 20px; border-radius: 15px; font-size: 20px; width: 100%; text-align: left; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); margin-bottom: 15px; }
     .route-btn:active { background: #333; }
     .route-count { font-size: 16px; color: #888; }
     .btn-new-route { background: #2962FF; color: white; border: none; padding: 18px; border-radius: 12px; font-size: 18px; width: 100%; font-weight: bold; margin-top: 10px; }
     .import-export-box { width: 100%; background: #222; padding: 20px; border-radius: 12px; }
     .btn-export { background: #00897B; color: white; padding: 14px; border-radius: 8px; border: none; font-weight: bold; width: 100%; margin-bottom: 12px; font-size: 16px; }
     .btn-import { background: #8E24AA; color: white; padding: 14px; border-radius: 8px; border: none; font-weight: bold; width: 100%; font-size: 16px; }

     #view-map { position: relative; } 
     #map { height: 45%; flex-shrink: 0; width: 100%; z-index: 1; position: relative; }
     
     .btn-list-top { position: absolute; top: 15px; right: 15px; font-size: 18px; background: rgba(0,0,0,0.8); border: none; color: white; padding: 10px 15px; border-radius: 12px; z-index: 1000; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
     .btn-back-start { position: absolute; top: 15px; left: 15px; z-index: 1000; background: rgba(0,0,0,0.8); color: white; border: none; padding: 10px 15px; border-radius: 12px; font-weight: bold; font-size: 18px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }

     .info-area { flex-grow: 1; padding: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: #121212; overflow-y: auto; }
     .address { font-size: 28px; font-weight: bold; width: 100%; margin-bottom: 5px; }
     .big-number { font-size: 90px; font-weight: bold; margin: 0; color: #00E676; line-height: 1.1; }
     .label { font-size: 18px; color: #aaa; margin-bottom: auto; }
     .btn-next { font-size: 22px; padding: 16px; background: #2962FF; color: white; border: none; border-radius: 15px; width: 100%; font-weight: bold; margin-bottom: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
     .btn-next:active { background: #1C44B2; }
     #gps-status { font-size: 14px; color: #888; }

     #view-list { background: #1a1a1a; }
     .header-bar { background: #222; padding: 15px 20px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #333; flex-shrink: 0; }
     .header-title { font-size: 20px; font-weight: bold; flex-grow: 1; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
     .btn-back { background: #444; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-size: 16px; font-weight: bold; }
     
     .clean-list { list-style: none; padding: 15px; margin: 0; overflow-y: auto; flex-grow: 1; }
     .clean-item { background: #252525; padding: 15px; margin-bottom: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
     .clean-item .street { font-size: 18px; font-weight: bold; }
     .clean-item .details { font-size: 14px; color: #aaa; margin-top: 5px; }
     .clean-item .count-badge { background: #2962FF; color: white; font-size: 20px; font-weight: bold; padding: 5px 15px; border-radius: 20px; }
     .current-stop { border-left: 5px solid #00E676; }

     .bottom-bar { padding: 15px; background: #222; border-top: 1px solid #333; flex-shrink: 0; }
     .btn-edit-mode { width: 100%; padding: 15px; font-size: 18px; background: #FF9800; color: black; font-weight: bold; border: none; border-radius: 10px; }
     
     #view-edit { background: #1a1a1a; }
     .edit-scroll-area { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; overflow-x: hidden; }
     .edit-list { list-style: none; padding: 15px; margin: 0; }
     
     .edit-item { background: #2a2a2a; padding: 10px; margin-bottom: 10px; border-radius: 10px; display: flex; align-items: center; gap: 8px; border: 1px solid #444; }
     .drag-handle { font-size: 26px; color: #888; padding: 5px 10px; cursor: grab; display: flex; align-items: center; }
     
     .edit-street { flex-grow: 1; background: #111; color: white; padding: 12px; font-size: 16px; min-width: 0; }
     .edit-count { width: 60px !important; text-align: center; background: #111; color: white; font-weight: bold; font-size: 18px; padding: 12px; flex-shrink: 0; }
     #new-count { width: 70px !important; flex-shrink: 0; text-align: center; background: #111; color: white; }
     
     .action-btns { display: flex; flex-direction: column; gap: 5px; }
     .btn-gps-fix { background: #00E676; color: black; border: none; border-radius: 6px; width: 45px; height: 35px; font-size: 16px; font-weight: bold; }
     .btn-del { background: #FF1744; color: white; border: none; border-radius: 6px; width: 45px; height: 35px; font-size: 16px; font-weight: bold; }

     .add-box { background: #222; padding: 15px; margin: 0 15px 15px 15px; border-radius: 12px; border: 2px dashed #444; }
     #edit-map { height: 250px; width: 100%; border-radius: 8px; margin-bottom: 10px; background: #333; z-index: 1; }
     #edit-map-instruction { font-size: 14px; color: #aaa; margin-bottom: 10px; text-align: center; }
     
     .add-row { display: flex; gap: 10px; margin-bottom: 10px; }
     .btn-add { font-size: 18px; padding: 12px; background: #2962FF; color: white; border: none; border-radius: 8px; width: 100%; font-weight: bold; }
     .btn-save-edit { background: #00E676; color: black; font-weight: bold; padding: 10px 15px; border-radius: 8px; border: none; font-size: 16px; }
     .btn-del-route-desktop { width: 100%; margin-top: 20px; padding: 15px; background: #FF1744; color: white; border: none; border-radius: 10px; font-weight:bold; font-size: 16px; }

     @media (min-width: 900px) {
       #view-start { padding: 50px; justify-content: center; }
       .start-container { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; max-width: 1800px; margin: auto; }
       .start-header-full { grid-column: 1 / -1; text-align: center; margin-bottom: 40px; }
       .start-title { font-size: 70px; margin: 0; }
       .route-btn { padding: 35px 40px; font-size: 32px; border-radius: 20px; margin-bottom: 25px; }
       .route-count { font-size: 26px; }
       .btn-new-route { padding: 30px; font-size: 28px; border-radius: 18px; margin-top: 20px; }
       .import-export-box { padding: 45px; border-radius: 25px; }
       .import-export-box h3 { font-size: 32px !important; margin-bottom: 20px !important; }
       .import-export-box p { font-size: 22px !important; margin-bottom: 35px !important; }
       .btn-export, .btn-import { padding: 26px; font-size: 26px; border-radius: 16px; margin-bottom: 22px; }
       #view-map { flex-direction: row; }
       #map { height: 100%; width: 50%; order: 1; }
       .info-area { width: 50%; height: 100%; order: 2; padding: 80px; justify-content: center; gap: 30px; }
       .address { font-size: 60px; line-height: 1.2; margin-bottom: 20px; }
       .big-number { font-size: 240px; line-height: 1; }
       .label { font-size: 36px; margin-bottom: 40px; }
       .btn-next { font-size: 45px; padding: 40px; border-radius: 25px; max-width: 800px; }
       #gps-status { font-size: 26px; margin-top: 25px; }
       .btn-list-top { font-size: 28px; padding: 20px 30px; border-radius: 18px; right: 30px; top: 30px; }
       .btn-back-start { font-size: 28px; padding: 20px 30px; border-radius: 18px; left: 30px; top: 30px; }
       .clean-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(500px, 1fr)); gap: 30px; max-width: 1800px; padding: 40px; margin: 0 auto; width: 100%; align-content: start; }
       .clean-item { padding: 35px; border-radius: 20px; margin-bottom: 0; }
       .clean-item .street { font-size: 32px; }
       .clean-item .details { font-size: 22px; margin-top: 12px; }
       .clean-item .count-badge { font-size: 32px; padding: 12px 30px; border-radius: 35px; }
       .header-bar { padding: 35px 50px; }
       .header-title { font-size: 40px; }
       .btn-back { font-size: 28px; padding: 18px 35px; }
       .bottom-bar { max-width: 1800px; margin: 0 auto; width: 100%; padding: 35px 50px; display: flex; gap: 40px; border-radius: 25px 25px 0 0; }
       .bottom-bar .btn-edit-mode { font-size: 32px; padding: 30px; border-radius: 18px; flex: 2; }
       .bottom-bar .btn-back { font-size: 28px; padding: 30px; border-radius: 18px; flex: 1; margin-top: 0 !important; }
       .edit-scroll-area { display: grid; grid-template-columns: 45% 55%; gap: 50px; max-width: 1800px; margin: 0 auto; width: 100%; padding: 50px; box-sizing: border-box; align-items: start; }
       .edit-list { padding: 0; overflow-y: auto; max-height: calc(100vh - 200px); padding-right: 20px; }
       .edit-item { padding: 25px; margin-bottom: 25px; border-radius: 18px; }
       .edit-street { font-size: 26px; padding: 20px; }
       .edit-count { font-size: 28px; width: 90px !important; padding: 20px; }
       .btn-gps-fix, .btn-del { width: 70px; height: 60px; font-size: 28px; }
       .add-box { margin: 0; padding: 40px; border-radius: 25px; position: sticky; top: 0; display: flex; flex-direction: column; background: #222; border-width: 4px; }
       .add-box strong { font-size: 32px; margin-bottom: 15px; }
       #edit-map-instruction { font-size: 24px; margin-bottom: 20px; }
       #edit-map { height: 50vh; min-height: 600px; border-radius: 20px; margin-bottom: 30px; }
       .add-row { gap: 20px; margin-bottom: 20px; }
       .add-row input { font-size: 26px; padding: 25px; }
       #new-count { width: 130px !important; }
       .btn-add { font-size: 32px; padding: 25px; border-radius: 18px; }
       .btn-save-edit { font-size: 28px; padding: 18px 35px; }
       .btn-del-route-desktop { font-size: 24px; padding: 25px; border-radius: 16px; margin-top: 40px; }
     }
  </style>
</head>
<body>

  <!-- 1. STARTSEITE -->
  <div id="view-start" class="view active-view">
    <div class="start-container">
      <div class="start-header-full">
        <h1 class="start-title">📰 Zeitungs-Navi</h1>
      </div>
      <div>
        <h3 style="margin-top:0; color:#aaa; font-size:22px;">Routen-Auswahl</h3>
        <div id="route-menu" class="route-list-container"></div>
        <button class="btn-new-route" onclick="createNewRoute()">+ Neue Route erstellen</button>
      </div>
      <div class="import-export-box">
        <h3 style="margin-top:0; color:#aaa;">Daten & Backup</h3>
        <p style="color:#888;">Verwalte deine Routen bequem per Excel/CSV am Computer.</p>
        <button class="btn-export" onclick="exportCSV()">⬇️ Tabelle herunterladen</button>
        <button class="btn-import" onclick="document.getElementById('csv-upload').click()">⬆️ Tabelle hochladen</button>
        <input type="file" id="csv-upload" accept=".csv" style="display:none" onchange="importCSV(event)">
      </div>
    </div>
  </div>

  <!-- 2. KARTE (AUSTRAGEN) -->
  <div id="view-map" class="view">
    <button class="btn-back-start" onclick="showView('view-start')">🏠 Menü</button>
    <button class="btn-list-top" onclick="openListView()">☰ Liste</button>
    <div id="map"></div>
    <div class="info-area">
      <div class="address" id="address">Lade...</div>
      <div class="big-number" id="count">-</div>
      <div class="label" id="label">Zeitungen</div>
      <button class="btn-next" id="btn-next" onclick="nextHouse()">Manuell Erledigt ➔</button>
      <div id="gps-status">Suche Satelliten...</div>
    </div>
  </div>

  <!-- 3. LISTEN ANSICHT (READ-ONLY) -->
  <div id="view-list" class="view">
    <div class="header-bar">
      <button class="btn-back" onclick="showView('view-map')">← Zurück</button>
      <h2 class="header-title" id="list-title">Routen-Liste</h2>
    </div>
    <ul class="clean-list" id="read-only-list"></ul>
    <div class="bottom-bar">
      <button class="btn-edit-mode" onclick="openEditView()">✏️ Liste bearbeiten</button>
      <button class="btn-back" onclick="resetTour()" style="background:#444;">Tour von vorne beginnen</button>
    </div>
  </div>

  <!-- 4. BEARBEITUNGS ANSICHT (MIT KARTE) -->
  <div id="view-edit" class="view">
    <div class="header-bar">
      <h2 class="header-title">Bearbeiten</h2>
      <button class="btn-save-edit" onclick="openListView()">✔ Fertig</button>
    </div>
    <div class="edit-scroll-area">
      <ul class="edit-list" id="edit-list-container"></ul>
      <div class="add-box" id="map-add-box">
        <strong>Adresse per Karte auswählen:</strong>
        <div id="edit-map-instruction">Tippe auf die Karte, um den Pin zu setzen.</div>
        <div id="edit-map"></div>
        <div class="add-row">
          <input type="text" id="new-street" placeholder="Straße & Hsnr. (Wird autom. ausgefüllt)" style="background:#111; color:white; flex-grow:1; min-width:0;">
          <input type="number" id="new-count" value="1" min="1">
        </div>
        <button class="btn-add" onclick="addStop()">+ Hinzufügen</button>
        <button onclick="deleteCurrentRoute()" class="btn-del-route-desktop">🗑 Diese komplette Route löschen</button>
      </div>
    </div>
  </div>

  <script>
    let savedRoutes = JSON.parse(localStorage.getItem('myRoutes'));
    let routes = savedRoutes || { "Meine erste Route": [] };
    let currentRouteName = localStorage.getItem('myCurrentRouteName') || Object.keys(routes)[0];
    let route = routes[currentRouteName];
    let currentIndex = parseInt(localStorage.getItem('myIndex')) || 0;
    
    let map, userMarker, editMap, editMarker;
    let houseMarkers = [];
    let hasArrived = false;
    let sortableInstance = null;
    let fixingIndex = null;
    
    // NEU: Variablen für das Routen-Tracking
    let walkedPathCoords = [];
    let pathLine = null;

    window.addEventListener('resize', () => {
      if(map) map.invalidateSize();
      if(editMap) editMap.invalidateSize();
    });

    function showView(viewId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active-view'));
      document.getElementById(viewId).classList.add('active-view');
      
      if (viewId === 'view-start') renderStartScreen();
      else if (viewId === 'view-map') { 
        if(map) { 
          setTimeout(() => { map.invalidateSize(); }, 50); 
          setTimeout(() => { map.invalidateSize(); }, 300); 
        } 
        updateMainUI(); 
      }
      else if (viewId === 'view-edit') { 
        if(editMap) { 
          setTimeout(() => { editMap.invalidateSize(); }, 50); 
          setTimeout(() => { editMap.invalidateSize(); }, 300);
        } 
      }
    }

    function renderStartScreen() {
      const menu = document.getElementById('route-menu');
      menu.innerHTML = '';
      for (let rName in routes) {
        let btn = document.createElement('button');
        btn.className = 'route-btn';
        let count = routes[rName].length;
        let savedIdx = parseInt(localStorage.getItem(`index_${rName}`)) || 0;
        let statusText = savedIdx >= count && count > 0 ? `<span style="color:#00E676">Fertig! ✔</span>` : `${count} Häuser ➔`;
        btn.innerHTML = `<span>🗺️ ${rName}</span> <span class="route-count">${statusText}</span>`;
        btn.onclick = () => selectRoute(rName);
        menu.appendChild(btn);
      }
    }

    function selectRoute(rName) {
      currentRouteName = rName;
      route = routes[currentRouteName];
      let savedIndex = localStorage.getItem(`index_${rName}`);
      currentIndex = savedIndex ? parseInt(savedIndex) : 0;
      if (currentIndex >= route.length && route.length > 0) currentIndex = 0;
      saveData(); initMap(); showView('view-map');
    }

    function createNewRoute() {
      let name = prompt("Name der neuen Route:");
      if (name && name.trim() !== "") {
        name = name.trim();
        if (!routes[name]) { routes[name] = []; saveData(); renderStartScreen(); } 
        else { alert("Route existiert bereits!"); }
      }
    }

    function deleteCurrentRoute() {
      if (Object.keys(routes).length <= 1) { alert("Du musst mindestens eine Route behalten!"); return; }
      if (confirm(`Möchtest du "${currentRouteName}" wirklich löschen?`)) {
        delete routes[currentRouteName];
        localStorage.removeItem(`index_${currentRouteName}`);
        currentRouteName = Object.keys(routes)[0];
        route = routes[currentRouteName]; 
        currentIndex = parseInt(localStorage.getItem(`index_${currentRouteName}`)) || 0;
        saveData(); 
        showView('view-start');
      }
    }

    function initMap() {
      if(map) { map.remove(); }
      let startLat = 48.3615; let startLng = 8.5255;
      if(route[currentIndex] && route[currentIndex].lat) { startLat = route[currentIndex].lat; startLng = route[currentIndex].lng; }
      
      map = L.map('map').setView([startLat, startLng], 17);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

      // NEU: Tracking-Linie auf der Karte initialisieren
      walkedPathCoords = [];
      pathLine = L.polyline([], {color: '#FF1744', weight: 4, opacity: 0.8, dashArray: '5, 5'}).addTo(map);

      houseMarkers = [];
      route.forEach((stop, index) => {
        if(stop.lat && stop.lng) {
          let marker = L.circleMarker([stop.lat, stop.lng], { radius: 8 }).addTo(map);
          houseMarkers.push({ index: index, marker: marker });
        }
      });
      
      setTimeout(() => { if(map) map.invalidateSize(); }, 300);
    }

    function updateMainUI() {
      const btnNext = document.getElementById('btn-next');
      if (route.length === 0) { 
        document.getElementById('address').innerText = "Keine Häuser!"; document.getElementById('count').innerText = "0"; 
        btnNext.innerText = "Zurück zum Menü"; btnNext.onclick = () => showView('view-start'); return; 
      }
      if (currentIndex >= route.length) { 
        document.getElementById('address').innerText = "Route beendet!"; document.getElementById('count').innerText = "🎉"; document.getElementById('gps-status').innerText = "";
        btnNext.innerText = "🏠 Zurück zum Menü"; btnNext.style.background = "#00E676"; btnNext.style.color = "black";
        btnNext.onclick = () => { showView('view-start'); }; return; 
      }
      
      btnNext.innerText = "Manuell Erledigt ➔"; btnNext.style.background = "#2962FF"; btnNext.style.color = "white"; btnNext.onclick = nextHouse;
      let currentStop = route[currentIndex];
      document.getElementById('address').innerText = currentStop.adresse;
      document.getElementById('count').innerText = currentStop.anzahl;
      
      houseMarkers.forEach(hm => {
        if (hm.index < currentIndex) hm.marker.setStyle({color: '#00E676', fillColor: '#00E676', radius: 6}); 
        else if (hm.index === currentIndex) hm.marker.setStyle({color: '#FF1744', fillColor: '#FF1744', radius: 14}); 
        else hm.marker.setStyle({color: 'gray', fillColor: 'gray', radius: 8}); 
      });
      if(currentStop.lat && map) { map.panTo([currentStop.lat, currentStop.lng]); }
    }

    function nextHouse() { if (currentIndex < route.length) { currentIndex++; hasArrived = false; saveData(); updateMainUI(); } }
    function resetTour() { if(confirm("Route wieder beim ersten Haus beginnen?")) { currentIndex = 0; saveData(); alert("Zurückgesetzt!"); showView('view-map'); } }

    function openListView() {
      document.getElementById('list-title').innerText = currentRouteName;
      const listElement = document.getElementById('read-only-list'); listElement.innerHTML = '';
      if(route.length === 0) { listElement.innerHTML = '<p style="text-align:center; color:#aaa; grid-column:1/-1;">Noch keine Häuser in dieser Route.</p>'; }
      
      route.forEach((stop, index) => {
        const li = document.createElement('li'); li.className = 'clean-item';
        if (index === currentIndex) li.classList.add('current-stop');
        let gpsText = stop.lat ? "📍 GPS vorhanden" : "⚠️ Kein GPS";
        li.innerHTML = `<div style="min-width:0; flex-grow:1; padding-right:10px;"><div class="street">${stop.adresse}</div><div class="details">Status: ${index < currentIndex ? 'Erledigt ✔' : (index === currentIndex ? 'Nächstes Ziel' : 'Ausstehend')} | ${gpsText}</div></div><div class="count-badge">${stop.anzahl}</div>`;
        listElement.appendChild(li);
      });
      showView('view-list');
    }

    function openEditView() {
      renderEditList();
      initEditMap();
      showView('view-edit');
    }

    function renderEditList() {
      if (sortableInstance) { sortableInstance.destroy(); sortableInstance = null; }
      const container = document.getElementById('edit-list-container'); container.innerHTML = '';
      
      route.forEach((stop, index) => {
        const li = document.createElement('li'); li.className = 'edit-item';
        let pinColor = stop.lat ? "#00E676" : "#FF9800"; 
        
        li.innerHTML = `
          <div class="drag-handle">☰</div>
          <input type="text" class="edit-street" value="${stop.adresse}" onchange="updateStop(${index}, 'adresse', this.value)">
          <input type="number" class="edit-count" value="${stop.anzahl}" min="1" onchange="updateStop(${index}, 'anzahl', this.value)">
          <div class="action-btns">
